input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  json {
    source => "message"
    target => "etl"
  }

  if [etl][@timestamp] {
    date {
      match => ["[etl][@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "batch-processing-%{+yyyy.MM.dd}"
    ilm_enabled => false
    manage_template => true
    template => "/usr/share/logstash/templates/batch-processing.json"
    template_name => "batch-processing"
    template_overwrite => true
  }
}
