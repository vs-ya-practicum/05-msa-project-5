apiVersion: 1

groups:
  - orgId: 1
    name: Batch Processing
    folder: Task 5
    interval: 10s
    rules:
      - uid: batch-job-failed
        title: BatchJobFailed
        condition: B
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: critical
          job_name: importProductJob
        annotations:
          __dashboardUid__: batch-processing
          __panelId__: "4"
          summary: "Финальный сбой обработки CSV"
          description: "Задание importProductJob завершилось неуспешно в последние 5 минут. Истечение окна не означает восстановление отчёта."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                (
                  (tw_batch_job_last_failure_timestamp_seconds{job="batch-processing",job_name="importProductJob"} > bool (time() - 300))
                  * (tw_batch_job_last_failure_timestamp_seconds{job="batch-processing",job_name="importProductJob"} <= bool time())
                  * (tw_batch_job_last_failure_timestamp_seconds{job="batch-processing",job_name="importProductJob"} > bool 0)
                )
                and on (job, instance) (up{job="batch-processing"} == 1)
              instant: true
              range: false
              intervalMs: 5000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: batch-job-too-long
        title: BatchJobTooLong
        condition: B
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: warning
          job_name: importProductJob
        annotations:
          __dashboardUid__: batch-processing
          __panelId__: "6"
          summary: "Превышена длительность обработки CSV"
          description: "Активное задание importProductJob выполняется более 60 секунд. Это демонстрационный порог; оповещение не останавливает задание."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                (
                  ((time() - tw_batch_job_active_start_timestamp_seconds{job="batch-processing",job_name="importProductJob"}) > bool 60)
                  * (tw_batch_job_active{job="batch-processing",job_name="importProductJob"} > bool 0)
                )
                and on (job, instance) (up{job="batch-processing"} == 1)
              instant: true
              range: false
              intervalMs: 5000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query
