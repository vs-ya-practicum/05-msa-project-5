apiVersion: v1
kind: Pod
metadata:
  name: export-reader
  namespace: task-3
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: reader
      image: task-3-export:1.0.0
      imagePullPolicy: Never
      command:
        - node
        - -e
        - setInterval(() => {}, 60000)
      volumeMounts:
        - name: exports
          mountPath: /exports
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  volumes:
    - name: exports
      persistentVolumeClaim:
        claimName: export-data
