apiVersion: v1
kind: Service
metadata:
  name: task1-mailpit
  namespace: task1
spec:
  selector:
    app: task1-mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: task1-mailpit
  namespace: task1
spec:
  serviceName: task1-mailpit
  replicas: 1
  selector:
    matchLabels:
      app: task1-mailpit
  template:
    metadata:
      labels:
        app: task1-mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27.4
          imagePullPolicy: IfNotPresent
          env:
            - name: MP_DATABASE
              value: /data/mailpit.db
            - name: MP_MAX_MESSAGES
              value: "5000"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
